# ─────────────────────────────────────────────────────────────────────────────
# Cogdoc — development docker-compose (Next.js + FastAPI + Postgres+pgvector)
#
# Sprint 3 portfolio artifact: a multi-service deployment that matches the
# target architecture in PRODUCT.md §10.1. Run Compose with
# `--env-file .env.local`; the app receives that file directly and selected
# embedding values are interpolated into FastAPI. Postgres is the canonical
# workspace and pgvector store.
#
# Usage:
#   docker compose --env-file .env.local -f docker-compose.dev.yml --profile full up -d --build
#   docker compose --env-file .env.local -f docker-compose.dev.yml --profile full down
# ─────────────────────────────────────────────────────────────────────────────
name: cogdoc-full

services:
  # ── Canonical Postgres + pgvector store ─────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cogdoc
      POSTGRES_PASSWORD: cogdoc_dev
      POSTGRES_DB: cogdoc
    ports:
      - "5432:5432"
    volumes:
      - cogdoc_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cogdoc"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI RAG service (Sprint 1) ───────────────────────────────────────
  rag:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Both services must use the same database: retrieved chunk IDs are
      # foreign keys into the application-owned PdfChunk table.
      DATABASE_URL: "postgresql://cogdoc:cogdoc_dev@postgres:5432/cogdoc"
      SUPABASE_DB_URL: "postgresql://cogdoc:cogdoc_dev@postgres:5432/cogdoc"
      # ADR-0008: create_app_from_env picks the embedder + store from these.
      # Unset → hermetic HashingEmbedder + in-memory store (offline dev).
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-gemini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-${AI_API_KEY:-}}"
    depends_on:
      vector-init:
        condition: service_completed_successfully
    profiles: ["full"]   # opt-in; run with --profile full
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ── Next.js app (the BFF + frontend) ─────────────────────────────────────
  # The Next.js server provides both the browser frontend and the application
  # API (BFF). Its entrypoint applies the Prisma schema and seeds a new local
  # database before serving requests.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cogdoc:local
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: "postgresql://cogdoc:cogdoc_dev@postgres:5432/cogdoc"
      FASTAPI_URL: "http://rag:8000"
      USE_VECTOR_RETRIEVAL: "true"
      COGDOC_SKIP_WIZARD: "1"
      # The image runs with NODE_ENV=production, so the dev-only fallback is
      # intentionally ignored. This explicit mode is safe for private local use.
      COGDOC_SINGLE_USER_MODE: "${COGDOC_SINGLE_USER_MODE:-1}"
      COGDOC_STORAGE_DIR: "/data/assets"
    volumes:
      - cogdoc_appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  # Prisma cannot create pgvector's Unsupported column. Apply the idempotent
  # raw migration after the app has created the Prisma-owned tables, and before
  # the RAG service receives requests.
  vector-init:
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: cogdoc_dev
    volumes:
      - ./fastapi/migrations/0001_pdfchunk_embedding_pgvector.sql:/migrations/0001_pdfchunk_embedding_pgvector.sql:ro
    command:
      - sh
      - -ec
      - psql -v ON_ERROR_STOP=1 -h postgres -U cogdoc -d cogdoc -f /migrations/0001_pdfchunk_embedding_pgvector.sql
    depends_on:
      app:
        condition: service_healthy
    profiles: ["full"]

  # PostgreSQL-backed queue worker for reprioritization and synthesis jobs.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cogdoc:local
    entrypoint: ["node", "scripts/research-worker.mjs"]
    environment:
      DATABASE_URL: "postgresql://cogdoc:cogdoc_dev@postgres:5432/cogdoc"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full"]

volumes:
  cogdoc_pgdata:
  cogdoc_appdata:
